<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>每週禱告認領表</title>
<style>
  :root{
    --paper:#f4f0e6; --card:#fdfbf5; --ink:#1a1814; --muted:#7d7461;
    --line:#c9bfa8; --accent:#8a5a2b; --shadow:rgba(40,30,15,.12);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{
    margin:0;padding:18px 14px 60px;background:var(--paper);color:var(--ink);
    font-family:"Noto Serif TC","Songti TC","PingFang TC","Microsoft JhengHei",serif;
    background-image:repeating-linear-gradient(0deg,transparent,transparent 23px,rgba(0,0,0,.012) 24px);
  }
  .wrap{max-width:760px;margin:0 auto;}
  header{text-align:center;margin-bottom:6px;}
  h1{margin:0;font-size:24px;letter-spacing:5px;font-weight:600;}
  .sub{font-family:"PingFang TC",sans-serif;font-size:13px;color:var(--muted);letter-spacing:1px;margin-top:4px;}
  .meetbtn{display:inline-block;margin-top:12px;font-family:"PingFang TC",sans-serif;font-size:15px;letter-spacing:1px;text-decoration:none;background:var(--ink);color:var(--card);border:1px solid var(--ink);border-radius:24px;padding:9px 22px;transition:background .2s;}
  .meetbtn:hover{background:var(--accent);border-color:var(--accent);}
  .weekbar{display:flex;align-items:center;justify-content:center;gap:10px;margin:16px 0;font-family:"PingFang TC",sans-serif;}
  select{font-family:inherit;font-size:14px;padding:7px 12px;border-radius:6px;border:1px solid var(--ink);background:var(--card);color:var(--ink);}
  .iconbtn{border:1px solid var(--line);background:var(--card);border-radius:6px;width:36px;height:36px;cursor:pointer;font-size:16px;color:var(--muted);}
  .iconbtn.spinning{animation:spin .8s linear infinite;color:var(--accent);}
  @keyframes spin{to{transform:rotate(360deg);}}
  select:disabled{opacity:.6;cursor:wait;}
  .loadingbox{grid-column:1/-1;text-align:center;font-family:"PingFang TC",sans-serif;font-size:14px;color:var(--accent);padding:34px 0;letter-spacing:1px;}
  .loadingbox::before{content:"⟳ ";display:inline-block;animation:spin .8s linear infinite;}
  .readonly-note{text-align:center;font-family:"PingFang TC",sans-serif;font-size:13px;color:var(--accent);background:#f3e9d8;border:1px dashed var(--line);border-radius:6px;padding:8px;margin-bottom:14px;display:none;}
  .banner{text-align:center;font-family:"PingFang TC",sans-serif;font-size:13px;background:#fbe3e0;color:#9a2b22;border:1px solid #e3b3ad;border-radius:6px;padding:10px;margin-bottom:14px;display:none;}
  .grid{display:grid;grid-template-columns:1fr;gap:12px;}
  @media(min-width:560px){.grid{grid-template-columns:1fr 1fr;}}
  .day{background:var(--card);border:1px solid var(--line);border-radius:8px;box-shadow:0 6px 20px var(--shadow);padding:14px 16px;}
  .day h2{margin:0 0 8px;font-size:17px;letter-spacing:2px;display:flex;align-items:center;justify-content:space-between;}
  .count{font-family:"PingFang TC",sans-serif;font-size:12px;color:var(--muted);font-weight:400;}
  .people{display:flex;flex-direction:column;gap:8px;min-height:8px;margin-bottom:10px;}
  .person{display:flex;align-items:center;gap:10px;font-family:"PingFang TC",sans-serif;font-size:13px;border-bottom:1px dashed #e6dec9;padding-bottom:6px;}
  .person:last-child{border-bottom:none;padding-bottom:0;}
  .person img{height:40px;width:auto;max-width:140px;background:#fff;border:1px solid #eee;border-radius:3px;}
  .person .meta{display:flex;flex-direction:column;line-height:1.35;flex:1;min-width:0;}
  .person .nm{font-weight:600;color:var(--ink);display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
  .person .goal{font-size:12px;color:var(--accent);margin:1px 0;}
  .person .tm{font-size:11px;color:var(--muted);}
  .badge{font-size:10px;font-family:"PingFang TC",sans-serif;background:#efe2c8;color:var(--accent);border:1px solid var(--line);border-radius:10px;padding:1px 7px;letter-spacing:1px;}
  .acts{display:flex;gap:6px;}
  .miniicon{border:1px solid var(--line);background:#fff;border-radius:5px;width:26px;height:26px;cursor:pointer;font-size:12px;color:var(--muted);line-height:1;}
  .miniicon:hover{background:#f0ece0;color:var(--accent);}
  .empty{font-family:"PingFang TC",sans-serif;font-size:12px;color:#b3a98f;font-style:italic;}
  .claim{width:100%;font-family:"PingFang TC",sans-serif;font-size:14px;padding:8px;border:1px solid var(--ink);border-radius:6px;background:var(--ink);color:var(--card);cursor:pointer;letter-spacing:1px;}
  .claim:hover{background:var(--accent);border-color:var(--accent);}
  .mask{position:fixed;inset:0;background:rgba(26,24,20,.5);display:none;align-items:center;justify-content:center;padding:14px;z-index:50;}
  .modal{background:var(--card);border-radius:10px;width:100%;max-width:560px;max-height:94vh;overflow:auto;padding:18px;box-shadow:0 20px 50px rgba(0,0,0,.3);}
  .modal h3{margin:0 0 12px;font-size:18px;letter-spacing:2px;}
  .modal label{font-family:"PingFang TC",sans-serif;font-size:13px;color:var(--muted);display:block;margin-bottom:6px;}
  .modal input[type=text]{width:100%;font-family:inherit;font-size:15px;padding:9px 11px;margin-bottom:12px;border:1px solid var(--line);border-radius:6px;background:#fff;}
  .modes{display:flex;gap:8px;margin-bottom:12px;font-family:"PingFang TC",sans-serif;flex-wrap:wrap;}
  .modebtn{flex:1;min-width:96px;font-family:inherit;font-size:13px;padding:9px 6px;border:1px solid var(--line);border-radius:7px;background:#fff;color:var(--ink);cursor:pointer;letter-spacing:1px;}
  .modebtn.on{background:var(--ink);color:var(--card);border-color:var(--ink);}
  .nweeks{display:none;align-items:center;gap:8px;margin-bottom:12px;font-family:"PingFang TC",sans-serif;font-size:13px;color:var(--muted);}
  .nweeks input{width:70px;font-size:15px;padding:7px 9px;border:1px solid var(--line);border-radius:6px;background:#fff;}
  .tools{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px;font-family:"PingFang TC",sans-serif;}
  .swatches{display:flex;gap:6px;}
  .sw{width:24px;height:24px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px var(--line);cursor:pointer;}
  .sw.on{box-shadow:0 0 0 2px var(--ink);transform:scale(1.12);}
  .sizes{display:flex;gap:6px;align-items:center;}
  .sz{width:28px;height:28px;border:1px solid var(--line);border-radius:6px;background:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;}
  .sz.on{border-color:var(--ink);background:#f0ece0;}
  .sz .dot{background:var(--ink);border-radius:50%;}
  .toolbtn{font-family:"PingFang TC",sans-serif;font-size:13px;border:1px solid var(--line);background:#fff;border-radius:6px;padding:6px 10px;cursor:pointer;color:var(--muted);}
  .toolbtn:hover{background:#f0ece0;color:var(--accent);}
  .pad{position:relative;border:1.5px solid var(--ink);border-radius:5px;background:#fff;}
  #pad{display:block;width:100%;height:clamp(130px,26vh,300px);touch-action:none;cursor:crosshair;border-radius:5px;}
  .row{display:flex;gap:10px;margin-top:14px;font-family:"PingFang TC",sans-serif;position:sticky;bottom:-18px;background:var(--card);padding:10px 0;border-top:1px solid var(--line);}
  .row button{flex:1;font-family:inherit;font-size:15px;padding:11px;border-radius:7px;cursor:pointer;letter-spacing:1px;border:1px solid var(--ink);}
  .btn-ghost{background:#fff;color:var(--ink);}
  .btn-ghost:hover{background:#f0ece0;}
  .btn-go{background:var(--ink);color:var(--card);}
  .btn-go:hover{background:var(--accent);border-color:var(--accent);}
  .btn-go:disabled{opacity:.4;cursor:not-allowed;}
  .hint{font-family:"PingFang TC",sans-serif;font-size:12px;color:var(--muted);margin:-4px 0 10px;}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--card);font-family:"PingFang TC",sans-serif;font-size:14px;padding:11px 20px;border-radius:30px;opacity:0;transition:opacity .25s;z-index:60;pointer-events:none;}
  .toast.show{opacity:1;}
  .person img{cursor:zoom-in;}
  .lightbox{position:fixed;inset:0;background:rgba(20,16,10,.85);display:none;align-items:center;justify-content:center;padding:20px;z-index:70;cursor:zoom-out;}
  .lightbox img{max-width:100%;max-height:92vh;background:#fff;border-radius:8px;box-shadow:0 20px 60px rgba(0,0,0,.5);}
  .prayer{background:var(--card);border:1px solid var(--line);border-radius:8px;box-shadow:0 6px 20px var(--shadow);padding:14px 16px;margin-top:16px;}
  .prayer-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:8px;}
  .prayer-title{font-size:17px;letter-spacing:2px;font-weight:600;}
  .prayer-upd{font-family:"PingFang TC",sans-serif;font-size:11px;color:var(--muted);}
  .prayer textarea{width:100%;min-height:150px;font-family:"PingFang TC",sans-serif;font-size:14px;line-height:1.6;padding:10px 12px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--ink);resize:vertical;}
  .prayer-row{display:flex;justify-content:flex-end;margin-top:10px;}
  .prayer-row button{font-family:"PingFang TC",sans-serif;font-size:14px;padding:9px 18px;border-radius:7px;border:1px solid var(--ink);cursor:pointer;letter-spacing:1px;}
  .prayer-row button:disabled{opacity:.4;cursor:not-allowed;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>禱告團契 每週固定禱告</h1>
    <div class="sub">每天晚上9:30~10:20 線上禱告</div>
    <a class="meetbtn" href="https://meet.google.com/wfw-arii-kxw" target="_blank" rel="noopener">🎥 進入禱告室</a>
  </header>

  <div class="banner" id="cfgBanner">⚠️ 尚未設定後端網址：請打開原始碼，把最上方的 API_URL 換成你的 GAS /exec 網址。</div>
  <div class="weekbar">
    <span style="font-family:'PingFang TC',sans-serif;font-size:13px;color:var(--muted)">週次</span>
    <select id="weekSel"></select>
    <button class="iconbtn" id="refresh" title="重新整理">⟳</button>
  </div>

  <div class="readonly-note" id="roNote">📖 歷史紀錄（唯讀）— 切回本週即可報名</div>
  <div class="grid" id="grid"></div>

  <div class="prayer">
    <div class="prayer-head">
      <span class="prayer-title">📝 代禱事項</span>
      <span class="prayer-upd" id="prayerUpd"></span>
    </div>
    <textarea id="prayerText" placeholder="在此寫下本週代禱事項（大家共用，可一起編輯）…"></textarea>
    <div class="prayer-row">
      <button class="btn-go" id="prayerSave">儲存代禱事項</button>
    </div>
  </div>
</div>

<!-- 報名 / 換圖 視窗 -->
<div class="mask" id="mask">
  <div class="modal">
    <h3 id="mTitle">登記 週日</h3>

    <div id="claimFields">
      <label>稱呼（必填，刪除/換圖需用同一稱呼）</label>
      <input type="text" id="nameInput" placeholder="例：張弟兄 / 小明" maxlength="30">

      <label>認領期間</label>
      <div class="modes">
        <button class="modebtn" data-mode="once">只報這週</button>
        <button class="modebtn on" data-mode="fixed">每週固定</button>
        <button class="modebtn" data-mode="nweeks">指定週數</button>
      </div>
      <div class="nweeks" id="nweeksRow">
        <span>從本週起連續</span>
        <input type="number" id="weeksInput" min="1" max="52" value="4">
        <span>週</span>
      </div>

      <label>個人禱告目標（選填）</label>
      <input type="text" id="goalInput" placeholder="例：為家人信主禱告" maxlength="200">
    </div>

    <label id="drawLabel">畫圖（選填）</label>
    <div class="tools">
      <div class="swatches" id="swatches"></div>
      <div class="sizes" id="sizes"></div>
      <button class="toolbtn" id="undoBtn">↶ 復原</button>
      <button class="toolbtn" id="clearBtn">清除</button>
    </div>
    <div class="pad">
      <canvas id="pad"></canvas>
    </div>
    <div class="hint" id="drawHint">小朋友可以在這裡畫畫，不畫也可以直接送出。</div>

    <div class="row">
      <button class="btn-ghost" id="cancel">取消</button>
      <button class="btn-go" id="submit">送出報名</button>
    </div>
  </div>
</div>

<div class="lightbox" id="lightbox">
  <img id="lightboxImg" src="" alt="放大簽名">
</div>

<div class="toast" id="toast"></div>

<script>
/* ====== 設定：把下面換成你的 GAS 網頁應用程式 /exec 網址 ====== */
const API_URL = 'https://script.google.com/macros/s/AKfycbxCZ5dKL3brplROr6rQwA6M1VR0RBHnRhJDGa2rXPcwOiQTKYlA-mogglFz8CE6pZ4/exec';
/* ============================================================ */

const DAY_NAMES = ['週日','週一','週二','週三','週四','週五','週六'];
const COLORS = ['#1a1814','#d23b2e','#2e6fd2','#2fa14b','#e88b1a','#8e44ad'];
const SIZES = [2.5, 5, 9];
let CURRENT_WEEK = null, VIEWING_WEEK = null, pollTimer = null;

/* ---- API 計時日誌：window.apiTimings 收集每次呼叫耗時，apiStats() 看分布 ---- */
window.apiTimings = [];
async function api(payload){
  const t0 = performance.now();
  const label = (payload && payload.action) + (payload && payload.week ? (' '+payload.week) : '');
  let ok = true, errMsg = '';
  try {
    const res = await fetch(API_URL, {
      method:'POST',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify(payload),
      redirect:'follow'
    });
    const json = await res.json();
    if(!json.ok){ ok=false; errMsg=json.error||'伺服器錯誤'; throw new Error(errMsg); }
    return json.data;
  } catch(e){ ok=false; errMsg=errMsg||e.message; throw e; }
  finally {
    const ms = Math.round(performance.now() - t0);
    window.apiTimings.push({ action: label, ms: ms, ok: ok, at: new Date().toLocaleTimeString() });
    console.log('[API] ' + label + ' → ' + ms + 'ms' + (ok ? '' : ' ❌ '+errMsg));
  }
}
/* 在 Console 輸入 apiStats() 看耗時分布；apiStats('getSignups') 只看某動作 */
window.apiStats = function(filter){
  let rows = window.apiTimings;
  if(filter) rows = rows.filter(r => r.action.indexOf(filter) === 0);
  if(!rows.length){ console.log('尚無資料'); return; }
  const ms = rows.map(r=>r.ms).sort((a,b)=>a-b);
  const sum = ms.reduce((a,b)=>a+b,0);
  const pct = p => ms[Math.min(ms.length-1, Math.floor(p/100*ms.length))];
  console.log('=== API 耗時分布 ('+rows.length+' 次) ===');
  console.table(rows);
  console.log('筆數='+ms.length+'  平均='+Math.round(sum/ms.length)+'ms  最小='+ms[0]+'  中位數(P50)='+pct(50)+'  P90='+pct(90)+'  最大='+ms[ms.length-1]+'ms');
  // 依動作分組平均
  const byAct = {};
  rows.forEach(r=>{ const k=r.action.split(' ')[0]; (byAct[k]=byAct[k]||[]).push(r.ms); });
  Object.keys(byAct).forEach(k=>{ const a=byAct[k]; console.log('  ['+k+'] '+a.length+'次 平均'+Math.round(a.reduce((x,y)=>x+y,0)/a.length)+'ms'); });
  return rows;
};

window.addEventListener('load', () => {
  if(API_URL.indexOf('PASTE_YOUR') === 0){
    document.getElementById('cfgBanner').style.display = 'block';
    return;
  }
  buildTools();
  api({action:'init'}).then(init).catch(onErr);
});

const weekCache = {}; // key -> signups，前端快取避免每次都等 GAS

function init(data){
  CURRENT_WEEK = data.currentWeek;
  VIEWING_WEEK = data.currentWeek;
  ALL_WEEKS = (data.weeks || []).map(w => w.key);
  weekCache[CURRENT_WEEK] = data.signups;
  buildWeekSelector(data.weeks);
  render(data.signups);
  if(data.prayer) setPrayer(data.prayer);
  startPolling();
  prefetchWeeks();
}

let ALL_WEEKS = [];
let prefetchTimer = null;
// 首次載入後，依序在背景悄悄預抓其它週次，存進快取
function prefetchWeeks(){
  const pending = ALL_WEEKS.filter(k => !(k in weekCache));
  let i = 0;
  clearInterval(prefetchTimer);
  prefetchTimer = setInterval(()=>{
    if(i >= pending.length){ clearInterval(prefetchTimer); return; }
    const k = pending[i++];
    if(k in weekCache) return;
    api({action:'getSignups', week:k})
      .then(s=>{ weekCache[k] = s; })
      .catch(()=>{});
  }, 1500); // 每 1.5 秒抓一週，避免一次打爆 GAS
}

function buildWeekSelector(weeks){
  const sel = document.getElementById('weekSel');
  sel.innerHTML = '';
  weeks.forEach(w => {
    const o = document.createElement('option');
    o.value = w.key;
    o.textContent = w.isCurrent ? ('本週 ' + w.label) : w.label;
    sel.appendChild(o);
  });
  sel.value = VIEWING_WEEK;
  sel.onchange = () => loadWeek(sel.value);
}

function loadWeek(key){
  VIEWING_WEEK = key;
  const cached = weekCache[key];
  if(cached){
    // 有快取：先秒顯示，背景悄悄重抓最新後無痕更新（不蓋載入中畫面）
    render(cached);
    setLoading(false);
    document.getElementById('refresh').classList.add('spinning');
    api({action:'getSignups', week:key})
      .then(s=>{ weekCache[key]=s; if(VIEWING_WEEK===key) render(s); })
      .catch(()=>{})
      .finally(()=>{ if(VIEWING_WEEK===key) document.getElementById('refresh').classList.remove('spinning'); });
  } else {
    // 無快取：正常顯示載入中
    setLoading(true);
    api({action:'getSignups', week:key})
      .then(s=>{ weekCache[key]=s; if(VIEWING_WEEK===key){ render(s); } })
      .catch(onErr)
      .finally(()=>{ if(VIEWING_WEEK===key) setLoading(false); });
  }
}

function setLoading(on){
  const grid = document.getElementById('grid');
  const sel = document.getElementById('weekSel');
  const btn = document.getElementById('refresh');
  sel.disabled = on;
  btn.disabled = on;
  btn.classList.toggle('spinning', on);
  if(on){
    grid.classList.add('loading');
    grid.innerHTML = '<div class="loadingbox">載入中…請稍候</div>';
  } else {
    grid.classList.remove('loading');
  }
}

function render(signups){
  const grid = document.getElementById('grid');
  const editable = (VIEWING_WEEK >= CURRENT_WEEK); // 本週與未來週可報名，過去週唯讀
  const note = document.getElementById('roNote');
  if(VIEWING_WEEK < CURRENT_WEEK){
    note.textContent = '📖 歷史紀錄（唯讀）— 切回本週即可報名';
    note.style.display = 'block';
  } else if(VIEWING_WEEK > CURRENT_WEEK){
    note.textContent = '📅 未來週 — 可預先報名';
    note.style.display = 'block';
  } else {
    note.style.display = 'none';
  }
  grid.innerHTML = '';
  for(let d=0; d<7; d++){
    const list = signups[d] || [];
    const card = document.createElement('div');
    card.className = 'day';
    let html = '<h2>'+DAY_NAMES[d]+'<span class="count">'+(list.length?(list.length+' 人'):'')+'</span></h2><div class="people">';
    if(list.length){
      list.forEach(p=>{
        const canManage = editable && (p.type==='fixed' || p.type==='nweeks' || true);
        html += '<div class="person">'
              + (p.img?'<img src="'+p.img+'" alt="圖" data-zoom="'+p.img+'">':'')
              + '<div class="meta"><span class="nm">'+escapeHtml(p.name)
              + (p.badge?'<span class="badge">'+escapeHtml(p.badge)+'</span>':'')
              + '</span>'
              + (p.goal?'<span class="goal">🎯 '+escapeHtml(p.goal)+'</span>':'')
              + '<span class="tm">'+escapeHtml(p.time)+'</span></div>'
              + (editable ? '<div class="acts">'
                  + '<button class="miniicon" title="改目標" data-act="goal" data-id="'+escapeHtml(p.id)+'" data-name="'+escapeHtml(p.name)+'" data-goal="'+escapeHtml(p.goal||'')+'">🎯</button>'
                  + '<button class="miniicon" title="換圖" data-act="img" data-id="'+escapeHtml(p.id)+'" data-name="'+escapeHtml(p.name)+'">🖼</button>'
                  + '<button class="miniicon" title="刪除" data-act="del" data-id="'+escapeHtml(p.id)+'" data-name="'+escapeHtml(p.name)+'">✕</button>'
                  + '</div>' : '')
              + '</div>';
      });
    } else {
      html += '<div class="empty">尚無人認領</div>';
    }
    html += '</div>';
    if(editable){
      html += '<button class="claim" data-day="'+d+'">＋ 我要登記'+DAY_NAMES[d]+'</button>';
    }
    card.innerHTML = html;
    grid.appendChild(card);
  }
  if(editable){
    grid.querySelectorAll('.claim').forEach(b=>{ b.onclick = ()=>openClaim(Number(b.dataset.day)); });
    grid.querySelectorAll('.miniicon').forEach(b=>{
      b.onclick = ()=>{
        if(b.dataset.act==='del') doDelete(b.dataset.id, b.dataset.name);
        else if(b.dataset.act==='goal') doEditGoal(b.dataset.id, b.dataset.name, b.dataset.goal);
        else openReplace(b.dataset.id, b.dataset.name);
      };
    });
  }
  grid.querySelectorAll('img[data-zoom]').forEach(im=>{ im.onclick = ()=>openLightbox(im.dataset.zoom); });
}

function startPolling(){
  clearInterval(pollTimer);
  pollTimer = setInterval(()=>{
    if(VIEWING_WEEK === CURRENT_WEEK && document.getElementById('mask').style.display!=='flex'){
      api({action:'getSignups', week:CURRENT_WEEK}).then(s=>{ weekCache[CURRENT_WEEK]=s; if(VIEWING_WEEK===CURRENT_WEEK) render(s); }).catch(()=>{});
    }
  }, 30000);
}

document.getElementById('refresh').onclick = ()=>loadWeek(VIEWING_WEEK);

/* ---------- 視窗模式 ---------- */
const mask=document.getElementById('mask');
let targetDay=null, claimMode='once', dialogMode='claim', replaceId=null, replaceName='';

document.querySelectorAll('.modebtn').forEach(b=>{
  b.onclick=()=>{
    document.querySelectorAll('.modebtn').forEach(x=>x.classList.remove('on'));
    b.classList.add('on');
    claimMode=b.dataset.mode;
    document.getElementById('nweeksRow').style.display = (claimMode==='nweeks')?'flex':'none';
  };
});

function openClaim(day){
  dialogMode='claim';
  targetDay=day; claimMode='fixed';
  document.getElementById('claimFields').style.display='block';
  document.getElementById('mTitle').textContent='登記 '+DAY_NAMES[day];
  document.getElementById('nameInput').value='';
  document.getElementById('goalInput').value='';
  document.querySelectorAll('.modebtn').forEach(x=>x.classList.toggle('on', x.dataset.mode==='fixed'));
  document.getElementById('nweeksRow').style.display='none';
  document.getElementById('drawLabel').textContent='畫圖（選填）';
  document.getElementById('drawHint').style.display='block';
  document.getElementById('submit').textContent='送出報名';
  mask.style.display='flex';
  setTimeout(()=>{ fitCanvas(); clearPad(); }, 30);
}

function openReplace(id, name){
  dialogMode='replace';
  replaceId=id; replaceName=name;
  document.getElementById('claimFields').style.display='none';
  document.getElementById('mTitle').textContent='換圖 — '+name;
  document.getElementById('drawLabel').textContent='畫一張新圖（會取代原本的圖）';
  document.getElementById('drawHint').style.display='none';
  document.getElementById('submit').textContent='更新圖片';
  mask.style.display='flex';
  setTimeout(()=>{ fitCanvas(); clearPad(); }, 30);
}

function closeModal(){ mask.style.display='none'; }
document.getElementById('cancel').onclick=closeModal;

/* ---------- 畫圖工具 ---------- */
const canvas=document.getElementById('pad'), ctx=canvas.getContext('2d');
let drawing=false, hasInk=false, last=null, penColor=COLORS[0], penSize=SIZES[0];
let strokes=[]; // for undo: store image snapshots

function buildTools(){
  const sw=document.getElementById('swatches');
  COLORS.forEach((c,i)=>{
    const el=document.createElement('div');
    el.className='sw'+(i===0?' on':''); el.style.background=c;
    el.onclick=()=>{ penColor=c; document.querySelectorAll('.sw').forEach(x=>x.classList.remove('on')); el.classList.add('on'); };
    sw.appendChild(el);
  });
  const sz=document.getElementById('sizes');
  SIZES.forEach((s,i)=>{
    const el=document.createElement('div');
    el.className='sz'+(i===0?' on':'');
    const dot=document.createElement('div'); dot.className='dot';
    const px=Math.max(4,Math.round(s*1.6)); dot.style.width=px+'px'; dot.style.height=px+'px';
    el.appendChild(dot);
    el.onclick=()=>{ penSize=s; document.querySelectorAll('.sz').forEach(x=>x.classList.remove('on')); el.classList.add('on'); };
    sz.appendChild(el);
  });
  document.getElementById('clearBtn').onclick=clearPad;
  document.getElementById('undoBtn').onclick=undo;
}

function fitCanvas(){
  const ratio=window.devicePixelRatio||1, rect=canvas.getBoundingClientRect();
  canvas.width=rect.width*ratio; canvas.height=rect.height*ratio;
  ctx.setTransform(ratio,0,0,ratio,0,0);
  ctx.lineCap='round'; ctx.lineJoin='round';
}
function clearPad(){
  const rect=canvas.getBoundingClientRect();
  ctx.fillStyle='#fff'; ctx.fillRect(0,0,rect.width,rect.height);
  hasInk=false; strokes=[];
}
function snapshot(){ try{ strokes.push(canvas.toDataURL()); if(strokes.length>20) strokes.shift(); }catch(e){} }
function undo(){
  if(!strokes.length){ clearPad(); return; }
  const prev=strokes.pop();
  const img=new Image();
  img.onload=()=>{ const rect=canvas.getBoundingClientRect(); ctx.fillStyle='#fff'; ctx.fillRect(0,0,rect.width,rect.height); ctx.drawImage(img,0,0,rect.width,rect.height); };
  img.src=prev;
  if(!strokes.length) hasInk=false;
}
function posOf(e){const r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top};}
function start(e){snapshot();drawing=true;last=posOf(e);ctx.beginPath();ctx.fillStyle=penColor;ctx.arc(last.x,last.y,penSize/2,0,7);ctx.fill();hasInk=true;}
function move(e){if(!drawing)return;const p=posOf(e);ctx.beginPath();ctx.strokeStyle=penColor;ctx.lineWidth=penSize;ctx.moveTo(last.x,last.y);ctx.lineTo(p.x,p.y);ctx.stroke();last=p;}
function end(){drawing=false;last=null;}
canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);start(e);});
canvas.addEventListener('pointermove',move);
canvas.addEventListener('pointerup',end);
canvas.addEventListener('pointercancel',end);

function exportSignature(){
  const rect=canvas.getBoundingClientRect();
  const outW=600, outH=Math.round(outW*rect.height/rect.width);
  const tmp=document.createElement('canvas'); tmp.width=outW; tmp.height=outH;
  const t=tmp.getContext('2d');
  t.fillStyle='#fff'; t.fillRect(0,0,outW,outH);
  t.drawImage(canvas,0,0,outW,outH);
  return tmp.toDataURL('image/png');
}

/* ---------- 送出 ---------- */
document.getElementById('submit').onclick=()=>{
  if(dialogMode==='replace'){
    if(!hasInk){ toast('請先畫一張新圖'); return; }
    const btn=document.getElementById('submit'); btn.disabled=true; btn.textContent='更新中…';
    api({action:'replaceImg', id:replaceId, name:replaceName, img:exportSignature()})
      .then(s=>{ closeModal(); btn.disabled=false; btn.textContent='更新圖片'; weekCache[VIEWING_WEEK]=s; render(s); toast('圖片已更新'); })
      .catch(err=>{ btn.disabled=false; btn.textContent='更新圖片'; onErr(err); });
    return;
  }
  const name=document.getElementById('nameInput').value.trim();
  if(!name){ toast('請輸入稱呼'); return; }
  let weeks=0;
  if(claimMode==='nweeks'){
    weeks=parseInt(document.getElementById('weeksInput').value,10)||0;
    if(weeks<1){ toast('週數需 ≥ 1'); return; }
  }
  const btn=document.getElementById('submit'); btn.disabled=true; btn.textContent='送出中…';
  const img=hasInk?exportSignature():'';
  const goal=document.getElementById('goalInput').value;
  api({action:'submit', day:targetDay, name:name, img:img, mode:claimMode, weeks:weeks, goal:goal, week:VIEWING_WEEK})
    .then(s=>{
      closeModal(); btn.disabled=false; btn.textContent='送出報名';
      weekCache[VIEWING_WEEK]=s; render(s); toast('已完成認領，感謝您！');
    })
    .catch(err=>{ btn.disabled=false; btn.textContent='送出報名'; onErr(err); });
};

function doEditGoal(id, name, cur){
  const input=prompt('修改「'+name+'」的個人禱告目標：', cur||'');
  if(input===null) return;
  api({action:'editGoal', id:id, name:name, goal:input.trim()})
    .then(s=>{ weekCache[VIEWING_WEEK]=s; render(s); toast('已更新禱告目標'); })
    .catch(onErr);
}

function doDelete(id, name){
  const input=prompt('要刪除「'+name+'」的這筆認領，請輸入相同稱呼確認：','');
  if(input===null) return;
  if(input.trim()!==name){ toast('稱呼不符，未刪除'); return; }
  api({action:'remove', id:id, name:input.trim()})
    .then(s=>{ weekCache[VIEWING_WEEK]=s; render(s); toast('已刪除'); })
    .catch(onErr);
}

/* ---------- 圖片放大 ---------- */
const lightbox=document.getElementById('lightbox'), lightboxImg=document.getElementById('lightboxImg');
function openLightbox(src){ if(!src)return; lightboxImg.src=src; lightbox.style.display='flex'; }
lightbox.onclick=()=>{ lightbox.style.display='none'; lightboxImg.src=''; };

/* ---------- 代禱事項 ---------- */
function setPrayer(p){
  document.getElementById('prayerText').value = p.text || '';
  document.getElementById('prayerUpd').textContent = p.updated ? ('最後更新 '+p.updated) : '';
}
document.getElementById('prayerSave').onclick=()=>{
  const btn=document.getElementById('prayerSave'), txt=document.getElementById('prayerText').value;
  btn.disabled=true; btn.textContent='儲存中…';
  api({action:'savePrayer', text:txt})
    .then(p=>{ setPrayer(p); btn.disabled=false; btn.textContent='儲存代禱事項'; toast('代禱事項已儲存'); })
    .catch(err=>{ btn.disabled=false; btn.textContent='儲存代禱事項'; onErr(err); });
};

function escapeHtml(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2600);}
function onErr(err){toast('發生錯誤：'+(err&&err.message?err.message:err));}
</script>
